name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - run: claude plugin validate plugins/stronux --strict
      - run: node scripts/build-chatgpt-zip.mjs --allow-draft
